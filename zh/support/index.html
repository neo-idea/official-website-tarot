<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>支持 — 塔罗占卜-一牌一悟</title><meta name="description" content="塔罗占卜-一牌一悟的支持与常见问题。"><meta name="robots" content="index,follow"><link rel="canonical" href="https://tarot.zpad.app/zh/support/"><link rel="icon" type="image/png" href="/assets/app-icon.png"><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><div class="container header-inner"><a class="brand" href="/zh/"><img src="/assets/app-icon.png" alt=""><strong>支持</strong></a><nav class="nav"><a class="language" href="/support/" hreflang="en" lang="en">English</a></nav></div></header><main class="section"><div class="container" style="max-width:860px"><p class="eyebrow">支持</p><h1 class="section-title">需要什么帮助？</h1><div class="info-panel" style="margin-top:26px"><h2 class="section-title" style="font-size:24px">常见问题</h2><p class="section-intro" style="text-align:left">我的解读记录保存在哪里？<br>所有记录都只保存在你的设备上，不会上传到服务器。</p><p class="section-intro" style="text-align:left">Premium 可以恢复吗？<br>可以。在付费解锁页选择“恢复购买”，并使用同一个 Apple ID。</p><p class="section-intro" style="text-align:left">可以删除历史记录吗？<br>可以在 App 的历史页删除单条记录，或在 iOS 设置中重置 App 数据。</p><p class="section-intro" style="text-align:left">没有网络可以用吗？<br>完整牌库和解读支持离线使用；广告需要网络连接。</p><p style="margin:26px 0 0;color:var(--muted)">卸载 App 会删除本机保存的解读记录。如需保留，请先自行导出或备份。</p></div><p style="margin-top:28px"><a class="button ghost" href="/privacy/">隐私政策</a></p></div></main><footer class="footer"><div class="container footer-inner"><span>© 2026 Yipaiyiwu</span><a href="/zh/">返回首页</a></div></footer></body></html>
